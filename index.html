<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>DJANGO注文管理システム</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans JP','Hiragino Sans',sans-serif;background:#f8f7f4;color:#1a1a1a;min-height:100vh}
.header{background:#1c1917;padding:0 16px;height:52px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
.header-title{color:#fff;font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:#f59e0b}
.who{display:flex;align-items:center;gap:8px}
.role{font-size:12px;font-weight:700;padding:4px 10px;border-radius:20px;background:#44403c;color:#d6d3d1}
.role.store{background:#f59e0b;color:#1c1917}.role.wholesaler{background:#6366f1;color:#fff}
.hbtn{background:none;border:1px solid #78716c;color:#fff;border-radius:6px;padding:5px 10px;font-size:12px;font-family:inherit;cursor:pointer}
.main{max-width:700px;margin:0 auto;padding:16px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.stat-card{background:#fff;border-radius:10px;padding:12px 14px;border:1px solid #e7e5e4}
.stat-label{font-size:11px;color:#78716c}.stat-value{font-size:26px;font-weight:700}
.btn{padding:10px 18px;border-radius:8px;border:none;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit}
.btn-primary{background:#f59e0b;color:#1c1917}
.btn-secondary{background:#fff;color:#1c1917;border:1px solid #d6d3d1;font-weight:600}
.btn-dark{background:#1c1917;color:#fff}
.btn-danger{background:#fee2e2;color:#dc2626;padding:6px 12px;font-size:12px;font-weight:600;border:none;border-radius:6px;cursor:pointer;font-family:inherit}
.btn-green,.btn-purple{color:#fff;padding:8px 14px;font-size:13px;font-weight:700;border:none;border-radius:6px;cursor:pointer;font-family:inherit}
.btn-green{background:#10b981}.btn-purple{background:#6366f1}
.action-bar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.sync-status{font-size:12px;color:#10b981;margin-left:auto}
.notice{background:#fef3c7;color:#92400e;font-size:13px;padding:8px 12px;border-radius:8px;margin-bottom:12px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.filter-btn{padding:5px 12px;border-radius:20px;border:1px solid #d6d3d1;cursor:pointer;font-size:12px;font-family:inherit;background:#fff;color:#78716c}
.filter-btn.active{background:#1c1917;color:#fff;border-color:#1c1917;font-weight:700}
.form-card{background:#fff;border-radius:12px;border:1px solid #e7e5e4;padding:16px;margin-bottom:14px}
.form-title{font-weight:700;font-size:15px;margin-bottom:14px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form-group label,.lbl{font-size:12px;color:#78716c;display:block;margin-bottom:4px}
input,select{width:100%;padding:9px 12px;border:1px solid #d6d3d1;border-radius:6px;font-size:16px;font-family:inherit;outline:none;background:#fff}
.form-actions{display:flex;gap:8px;margin-top:14px}
.order-list{display:flex;flex-direction:column;gap:8px}
.order-card{background:#fff;border-radius:12px;border:1px solid #e7e5e4;padding:14px 16px;border-left:4px solid}
.order-top{display:flex;justify-content:space-between;gap:8px}
.order-name{font-weight:700;font-size:16px;margin-bottom:4px}
.order-model{font-size:12px;color:#78716c;background:#f5f5f4;padding:2px 8px;border-radius:4px;margin-left:6px}
.badge{font-size:12px;padding:3px 10px;border-radius:20px;font-weight:600;display:inline-block}
.order-meta{margin-top:6px;font-size:13px;color:#57534e;display:flex;gap:12px;flex-wrap:wrap}
.order-memo{margin-top:6px;font-size:13px;color:#78716c;background:#fafaf9;padding:4px 10px;border-radius:4px}
.order-time{font-size:11px;color:#a8a29e;margin-top:4px}
.order-actions{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.empty,.loading{text-align:center;padding:50px 20px;color:#a8a29e;background:#fff;border-radius:12px;border:1px solid #e7e5e4}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal-overlay.on{display:flex}
.modal{background:#fff;border-radius:16px;width:100%;max-width:520px;max-height:85vh;overflow-y:auto;padding:20px}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.modal-title{font-weight:700;font-size:17px}
.modal-close{background:none;border:none;font-size:22px;cursor:pointer;color:#78716c}
.weekly-preview{background:#fafaf9;border-radius:8px;padding:14px;font-family:monospace;font-size:12px;white-space:pre-wrap;margin:10px 0 14px;border:1px solid #e7e5e4;line-height:1.8;max-height:40vh;overflow-y:auto}
.modal-actions{display:flex;gap:10px}.modal-actions .btn{flex:1}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1c1917;color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;font-weight:600;z-index:200;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
@media print{.header,.action-bar,.filters,.stats,.main>*:not(#x){display:none!important}.modal-overlay.on{position:static;display:block;background:none}.modal-actions,.modal-close,select{display:none}}
</style>
</head>
<body>
<div class="header">
  <div class="header-title"><div class="dot"></div>DJANGO注文管理システム</div>
  <div class="who"><span class="role" id="role">閲覧のみ</span><button class="hbtn" id="auth-btn" onclick="openLogin()">ログイン</button></div>
</div>

<div class="main">
  <div class="notice" id="notice">閲覧のみのモードです。注文の登録や変更をするには、ログインしてください。</div>
  <div class="stats">
    <div class="stat-card"><div class="stat-label">全注文</div><div class="stat-value" id="stat-total">-</div></div>
    <div class="stat-card"><div class="stat-label" id="sl-pending">未確認</div><div class="stat-value" id="stat-pending" style="color:#f59e0b">-</div></div>
    <div class="stat-card"><div class="stat-label" id="sl-reserved">押さえ済み</div><div class="stat-value" id="stat-reserved" style="color:#10b981">-</div></div>
  </div>
  <div class="action-bar">
    <button class="btn btn-primary" id="add-btn" style="display:none" onclick="toggleForm()">＋ 注文を追加</button>
    <button class="btn btn-secondary" onclick="openWeekly()">📋 週次リスト</button>
    <div class="sync-status" id="sync-status">接続中...</div>
  </div>
  <div class="filters">
    <button class="filter-btn active" onclick="setFilter('all',this)">すべて</button>
    <button class="filter-btn" id="ft-pending" onclick="setFilter('pending',this)">未確認</button>
    <button class="filter-btn" id="ft-reserved" onclick="setFilter('reserved',this)">押さえ済み</button>
    <button class="filter-btn" id="ft-ordered" onclick="setFilter('ordered',this)">注文済み</button>
  </div>
  <div class="form-card" id="order-form" style="display:none">
    <div class="form-title">新規注文登録</div>
    <div class="form-grid">
      <div class="form-group"><label>商品名 ＊</label><input id="f-product" placeholder="例：デリア左カウチ"></div>
      <div class="form-group"><label>カラー</label><input id="f-model" placeholder="例：CAMやCACAO等"></div>
      <div class="form-group"><label>数量 ＊</label><input id="f-qty" placeholder="例：2"></div>
      <div class="form-group"><label>お客様番号 ＊</label><input id="f-customer" placeholder="例：358"></div>
      <div class="form-group" style="grid-column:span 2"><label>備考</label><input id="f-memo" placeholder="納期指定など"></div>
    </div>
    <div class="form-actions">
      <button class="btn btn-dark" onclick="addOrder()">登録する</button>
      <button class="btn btn-secondary" onclick="toggleForm()">キャンセル</button>
    </div>
  </div>
  <div id="order-list"><div class="loading">接続中...</div></div>
</div>

<div class="modal-overlay" id="login-modal">
  <div class="modal" style="max-width:380px">
    <div class="modal-header"><div class="modal-title">ログイン</div><button class="modal-close" onclick="closeLogin()">✕</button></div>
    <label class="lbl">利用者</label>
    <select id="l-role"><option value="store">店舗</option><option value="wholesaler">問屋</option></select>
    <label class="lbl" style="margin-top:10px">パスワード</label>
    <input type="password" id="l-pass" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
    <div class="form-actions"><button class="btn btn-dark" style="flex:1" onclick="doLogin()">ログイン</button></div>
  </div>
</div>

<div class="modal-overlay" id="weekly-modal" onclick="if(event.target.id==='weekly-modal')closeWeekly()">
  <div class="modal">
    <div class="modal-header"><div class="modal-title">📋 週次注文リスト</div><button class="modal-close" onclick="closeWeekly()">✕</button></div>
    <label class="lbl">対象週を選択</label>
    <select id="week-select" onchange="updatePreview()"></select>
    <div class="weekly-preview" id="weekly-preview">週を選択してください</div>
    <div class="modal-actions">
      <button class="btn btn-dark" id="copy-btn" onclick="copyText()">📋 テキストをコピー</button>
      <button class="btn btn-secondary" onclick="window.print()">🖨️ 印刷</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, onValue, push, update, remove } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const app = initializeApp({
  apiKey: "AIzaSyDx6oJnre3L1UWcYzeKFzPjaLo5_E5qZLc",
  authDomain: "django-interior.firebaseapp.com",
  databaseURL: "https://django-interior-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "django-interior",
  storageBucket: "django-interior.firebasestorage.app",
  messagingSenderId: "600675642337",
  appId: "1:600675642337:web:2e420e6553093600f200a0"
});
const db = getDatabase(app), auth = getAuth(app), ordersRef = ref(db, 'orders');

// ログイン用メールアドレス（Firebaseのユーザー登録と一致させてください）
const EMAILS = { store: 'store@django.local', wholesaler: 'wholesaler@django.local' };
const STATUS = {
  pending:  { color: '#f59e0b', bg: '#fef3c7' },
  reserved: { color: '#10b981', bg: '#d1fae5' },
  ordered:  { color: '#6366f1', bg: '#e0e7ff' },
};
// 表示の言い回し（店舗・閲覧：従来どおり／問屋：問屋用の言い方）
const LABELS = {
  store:      { pending: '未確認', reserved: '押さえ済み', ordered: '注文済み' },
  wholesaler: { pending: '未確定', reserved: '入荷確定分押さえ済み', ordered: '次回出荷確定分' }
};
const lab = st => (LABELS[role] || LABELS.store)[st];
function applyLabels() {
  ['pending', 'reserved', 'ordered'].forEach(k => { $('ft-' + k).textContent = lab(k); });
  $('sl-pending').textContent = lab('pending'); $('sl-reserved').textContent = lab('reserved');
}
let role = null, orders = {}, filterStatus = 'all', formOpen = false;
const $ = id => document.getElementById(id);

onAuthStateChanged(auth, user => {
  role = !user ? null : user.email === EMAILS.store ? 'store' : user.email === EMAILS.wholesaler ? 'wholesaler' : null;
  $('role').textContent = role === 'store' ? '店舗' : role === 'wholesaler' ? '問屋' : '閲覧のみ';
  $('role').className = 'role ' + (role || '');
  $('auth-btn').textContent = role ? 'ログアウト' : 'ログイン';
  $('notice').style.display = role ? 'none' : '';
  $('add-btn').style.display = role === 'store' ? '' : 'none';
  if (formOpen && role !== 'store') window.toggleForm();
  applyLabels(); render();
});

onValue(ordersRef, snap => {
  orders = snap.val() || {};
  $('sync-status').textContent = 'リアルタイム同期中';
  render();
}, () => { $('sync-status').innerHTML = '<span style="color:#ef4444">⚠ 接続エラー</span>'; });

window.openLogin = function() {
  if (role) { signOut(auth).then(() => showToast('ログアウトしました')); return; }
  $('l-pass').value = ''; $('login-modal').classList.add('on'); $('l-pass').focus();
};
window.closeLogin = () => $('login-modal').classList.remove('on');
window.doLogin = async function() {
  try {
    await signInWithEmailAndPassword(auth, EMAILS[$('l-role').value], $('l-pass').value);
    window.closeLogin(); showToast('✓ ログインしました');
  } catch (e) { showToast('⚠ パスワードが違います'); }
};

window.setFilter = function(s, btn) {
  filterStatus = s;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active'); render();
};
window.toggleForm = function() {
  formOpen = !formOpen;
  $('order-form').style.display = formOpen ? '' : 'none';
  if (!formOpen) ['f-product','f-model','f-qty','f-customer','f-memo'].forEach(id => $(id).value = '');
};

async function safe(fn, okMsg) {
  try { await fn(); if (okMsg) showToast(okMsg); return true; }
  catch (e) { showToast('⚠ 保存できませんでした（権限がありません）'); return false; }
}
window.addOrder = async function() {
  const v = id => $(id).value.trim();
  if (!v('f-product') || !v('f-qty') || !v('f-customer')) { showToast('⚠ 商品名・数量・お客様番号は必須です'); return; }
  const ok = await safe(() => push(ordersRef, {
    productName: v('f-product'), modelNumber: v('f-model'), quantity: v('f-qty'),
    customerName: v('f-customer'), memo: v('f-memo'), status: 'pending', createdAt: new Date().toISOString()
  }), '✓ 注文を登録しました');
  if (ok) window.toggleForm();
};
window.updateStatus = (id, status) => safe(() => update(ref(db, 'orders/' + id), { status }), `✓ 「${lab(status)}」に更新しました`);
window.deleteOrder = async id => { if (confirm('この注文を削除しますか？')) await safe(() => remove(ref(db, 'orders/' + id)), '削除しました'); };

const fmtDT = iso => { const d = new Date(iso); return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; };
const esc = s => String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function render() {
  const arr = Object.entries(orders).map(([id, o]) => ({ id, ...o })).sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
  $('stat-total').textContent = arr.length;
  $('stat-pending').textContent = arr.filter(o => o.status === 'pending').length;
  $('stat-reserved').textContent = arr.filter(o => o.status === 'reserved').length;
  const f = filterStatus === 'all' ? arr : arr.filter(o => o.status === filterStatus);
  if (!f.length) { $('order-list').innerHTML = '<div class="empty">📦<br>注文がありません</div>'; return; }
  $('order-list').innerHTML = f.map(o => {
    const s = STATUS[o.status] || STATUS.pending;
    let btn = '';
    if (role === 'wholesaler' && o.status === 'pending') btn = `<button class="btn-green" onclick="updateStatus('${o.id}','reserved')">${lab('reserved')}にする</button>`;
    else if (role === 'store' && o.status === 'reserved') btn = `<button class="btn-purple" onclick="updateStatus('${o.id}','ordered')">${lab('ordered')}にする</button>`;
    const del = role === 'store' ? `<button class="btn-danger" onclick="deleteOrder('${o.id}')">削除</button>` : '';
    return `<div class="order-card" style="border-left-color:${s.color}"><div class="order-top"><div>
      <div class="order-name">${esc(o.productName)}${o.modelNumber ? `<span class="order-model">${esc(o.modelNumber)}</span>` : ''}</div>
      <span class="badge" style="background:${s.bg};color:${s.color}">${lab(o.status)}</span>
      <div class="order-meta"><span>数量: <strong>${esc(o.quantity)}</strong></span><span>お客様: <strong>${esc(o.customerName)}</strong></span></div>
      ${o.memo ? `<div class="order-memo">備考: ${esc(o.memo)}</div>` : ''}
      <div class="order-time">登録: ${fmtDT(o.createdAt)}</div></div>
      <div class="order-actions">${btn}${del}</div></div></div>`;
  }).join('');
}

// 週次（2週間ごと・木曜始まり）
function getWeekKey(iso) {
  const jst = new Date(new Date(iso).getTime() + 9 * 3600000);
  let diff = jst.getUTCDay() - 4; if (diff < 0) diff += 7;
  const thu = new Date(jst); thu.setUTCDate(jst.getUTCDate() - diff);
  const base = new Date('2026-01-01T00:00:00Z');
  const days = Math.floor((thu.getTime() - base.getTime()) / 86400000);
  const start = new Date(base); start.setUTCDate(base.getUTCDate() + Math.floor(days / 14) * 14 + 7);
  return start.toISOString().slice(0, 10);
}
function getWeekLabel(wk) {
  const d = new Date(wk + 'T00:00:00Z'), e = new Date(d); e.setUTCDate(d.getUTCDate() + 13);
  return `${d.getUTCMonth()+1}/${d.getUTCDate()}（木）〜 ${e.getUTCMonth()+1}/${e.getUTCDate()}（水）`;
}
window.openWeekly = function() {
  const weeks = [...new Set(Object.values(orders).map(o => getWeekKey(o.createdAt)))].sort().reverse();
  if (!weeks.length) weeks.push(getWeekKey(new Date().toISOString()));
  $('week-select').innerHTML = weeks.map(w => `<option value="${w}">${getWeekLabel(w)}</option>`).join('');
  window.updatePreview(); $('weekly-modal').classList.add('on');
};
window.closeWeekly = () => $('weekly-modal').classList.remove('on');
window.updatePreview = () => { const wk = $('week-select').value; $('weekly-preview').textContent = wk ? generateText(wk) : '週を選択してください'; };
function generateText(wk) {
  const arr = Object.values(orders).filter(o => getWeekKey(o.createdAt) === wk).sort((a, b) => new Date(a.createdAt) - new Date(b.createdAt));
  const n = new Date(), L = ['【週次注文リスト】', `対象期間: ${getWeekLabel(wk)}`, `作成日時: ${n.getFullYear()}年${n.getMonth()+1}月${n.getDate()}日`, '─'.repeat(36), ''];
  arr.forEach((o, i) => {
    L.push(`${i+1}. ${o.productName}${o.modelNumber ? `（${o.modelNumber}）` : ''}`, `   数量: ${o.quantity}　お客様: ${o.customerName}`);
    if (o.memo) L.push(`   備考: ${o.memo}`);
    L.push(`   ステータス: ${lab(o.status) || o.status}`, '');
  });
  L.push('─'.repeat(36), `合計 ${arr.length} 件`);
  return L.join('\n');
}
window.copyText = async function() {
  const wk = $('week-select').value; if (!wk) return;
  const text = generateText(wk);
  try { await navigator.clipboard.writeText(text); }
  catch (e) { const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
  $('copy-btn').textContent = '✓ コピー完了！';
  setTimeout(() => $('copy-btn').textContent = '📋 テキストをコピー', 2000);
};
function showToast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}
</script>
</body>
</html>
